plugins {
    id 'base'
    id 'org.jetbrains.intellij.platform' version '2.16.0' apply false
}

abstract class VerifyDevEcoDependencies extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getDevEcoDirectory()

    @Input
    abstract ListProperty<String> getJarPatterns()

    @Input
    abstract Property<String> getModulePath()

    @TaskAction
    void verifyDependencies() {
        def baseDir = devEcoDirectory.get().asFile
        jarPatterns.get().each { pattern ->
            def scanner = new org.apache.tools.ant.DirectoryScanner()
            scanner.basedir = baseDir
            scanner.includes = [pattern] as String[]
            scanner.scan()
            def matches = scanner.includedFiles.sort()
            if (matches.size() != 1) {
                throw new GradleException(
                        "${modulePath.get()}: expected exactly one DevEco JAR for '${pattern}', " +
                                "but found ${matches.size()} under ${baseDir.absolutePath}: " +
                                matches.collect { new File(baseDir, it).name }.join(', '))
            }
        }
    }
}

def targetIdeaVersion = providers.gradleProperty('ideaVersion').orElse('2026.1.1').get()

def npmCommand = providers.systemProperty('os.name').get().toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

def buildSupportDir = layout.projectDirectory.dir('build-support')
def buildSupportPackage = new groovy.json.JsonSlurper().parse(buildSupportDir.file('package.json').asFile)
def buildSupportArchiveName = "ohos-cangjie-build-support-${buildSupportPackage.version}.tgz"
def ohosNpmRegistry = providers.gradleProperty('ohosNpmRegistry')
        .orElse('https://repo.harmonyos.com/npm/')
def npmDevEcoRoot = layout.buildDirectory.dir(
        providers.gradleProperty('devecoDependencyVersion')
                .orElse('26.0.0.621')
                .map { "deveco/${it}" })
        .get().asFile

tasks.register('npmInstallBuildSupport', Exec) {
    group = 'build support'
    description = 'Installs the build-support TypeScript dependencies.'
    dependsOn 'prepareDevEcoDependencies'
    workingDir buildSupportDir
    commandLine npmCommand, 'install', '--package-lock=false', '--no-save',
            '--prefer-offline', '--no-audit', '--no-fund',
            '--registry', 'https://registry.npmjs.org/',
            "--@ohos:registry=${ohosNpmRegistry.get()}"
    inputs.files(buildSupportDir.file('package.json'), buildSupportDir.file('tsconfig.json'))
    inputs.property('devEcoNpmRoot', npmDevEcoRoot.absolutePath)
    outputs.dir(buildSupportDir.dir('node_modules'))
    doFirst {
        def packageRoots = [
                new File(npmDevEcoRoot, 'tools/hvigor'),
                new File(npmDevEcoRoot, 'plugins/hvigor-support/lib')
        ]
        def hvigorRoot = packageRoots.find { root ->
            new File(root, 'hvigor/package.json').isFile() &&
                    new File(root, 'hvigor-ohos-plugin/package.json').isFile()
        }
        if (hvigorRoot != null) {
            commandLine npmCommand, 'install', '--package-lock=false', '--no-save',
                    '--ignore-scripts', '--prefer-offline', '--no-audit', '--no-fund',
                    new File(hvigorRoot, 'hvigor').absolutePath,
                    new File(hvigorRoot, 'hvigor-ohos-plugin').absolutePath
            logger.lifecycle("Installing DevEco npm packages from ${hvigorRoot.absolutePath}")
        } else {
            throw new GradleException(
                    "DevEco npm packages were not found under ${npmDevEcoRoot.absolutePath}. " +
                            "Expected tools/hvigor/hvigor and tools/hvigor/hvigor-ohos-plugin.")
        }
    }
    doLast {
        def devEcoRoot = npmDevEcoRoot
        def packageRoots = [
                new File(devEcoRoot, 'tools/hvigor'),
                new File(devEcoRoot, 'plugins/hvigor-support/lib')
        ]
        def hvigorRoot = packageRoots.find { root ->
            new File(root, 'hvigor/package.json').isFile() &&
                    new File(root, 'hvigor-ohos-plugin/package.json').isFile()
        }
        if (hvigorRoot == null) {
            logger.lifecycle("DevEco npm packages were not found under ${devEcoRoot.absolutePath}; using the configured npm packages")
            return
        }
        def localPackages = [
                new File(hvigorRoot, 'hvigor'),
                new File(hvigorRoot, 'hvigor-ohos-plugin')
        ]
        localPackages.each { packageDir ->
            def destinationDir = new File(buildSupportDir.asFile,
                    "node_modules/@ohos/${packageDir.name}")
            java.nio.file.Files.walk(packageDir.toPath()).withCloseable { paths ->
                paths.forEach { sourcePath ->
                    def relativePath = packageDir.toPath().relativize(sourcePath)
                    def destinationPath = destinationDir.toPath().resolve(relativePath)
                    if (java.nio.file.Files.isDirectory(sourcePath)) {
                        java.nio.file.Files.createDirectories(destinationPath)
                    } else {
                        java.nio.file.Files.createDirectories(destinationPath.parent)
                        java.nio.file.Files.copy(sourcePath, destinationPath,
                                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    }
                }
            }
        }
        logger.lifecycle("Using DevEco npm packages from ${hvigorRoot.absolutePath}")
    }
}

tasks.register('compileBuildSupport', Exec) {
    group = 'build'
    description = 'Compiles the build-support TypeScript project.'
    dependsOn 'npmInstallBuildSupport'
    workingDir buildSupportDir
    commandLine npmCommand, 'run', 'build'
    inputs.files(fileTree(buildSupportDir) {
        include 'index.ts', 'src/**/*.ts', 'package.json', 'tsconfig.json'
        exclude '**/*.js', 'node_modules/**'
    })
    outputs.files(
            buildSupportDir.file('index.js'),
            buildSupportDir.file('index.d.ts'),
            fileTree(buildSupportDir.dir('src')) { include '**/*.js', '**/*.d.ts', '**/*.js.map' }
    )
}

tasks.register('testBuildSupport', Exec) {
    group = 'verification'
    description = 'Runs the build-support npm test suite.'
    dependsOn 'npmInstallBuildSupport'
    workingDir buildSupportDir
    commandLine npmCommand, 'test'
}

tasks.register('packBuildSupport', Exec) {
    group = 'distribution'
    description = 'Creates the build-support npm package.'
    dependsOn 'compileBuildSupport'
    workingDir buildSupportDir
    commandLine npmCommand, 'pack', '--pack-destination',
            buildSupportDir.asFile.absolutePath
    outputs.file(buildSupportDir.file(buildSupportArchiveName))
}

tasks.named('build') {
    dependsOn 'packBuildSupport'
    dependsOn subprojects.collect { it.tasks.named('build') }
}

// Build the support repository last so it consumes the completed outputs of
// the other Java subprojects when the root build is invoked.
project(':support') {
    plugins.withId('java') {
        tasks.named('build') {
            mustRunAfter rootProject.subprojects
                    .findAll { it.path != ':support' }
                    .collect { it.tasks.named('build') }
        }
    }
}

def devEcoDependencyVersion = providers.gradleProperty('devecoDependencyVersion')
        .orElse('26.0.0.621')
def devEcoObsBaseUrl = providers.gradleProperty('devecoObsBaseUrl')
        .orElse('https://cangjie103.obs.cn-north-4.myhuaweicloud.com')

repositories {
    ivy {
        name = 'devEcoObs'
        url = uri("${devEcoObsBaseUrl.get()}/DevecoPluginsBuild")
        patternLayout {
            artifact '[revision]/[artifact].[ext]'
        }
        metadataSources {
            artifact()
        }
        content {
            includeModule('com.huawei.deveco', 'deveco-dependencies')
        }
    }
}

configurations {
    devEcoBundle {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    devEcoBundle "com.huawei.deveco:deveco-dependencies:${devEcoDependencyVersion.get()}@zip"
}

def devEcoDirProvider = layout.buildDirectory.dir(
        devEcoDependencyVersion.map { "deveco/${it}" })
def prepareDevEcoDependencies = tasks.register('prepareDevEcoDependencies', Sync) {
    group = 'build setup'
    description = 'Downloads and extracts the versioned DevEco dependency bundle from OBS.'
    from { zipTree(configurations.devEcoBundle.singleFile) }
    into devEcoDirProvider
    inputs.property('devEcoDependencyVersion', devEcoDependencyVersion)
    doLast {
        def extractedDir = devEcoDirProvider.get().asFile
        if (!new File(extractedDir, 'product-info.json').isFile() ||
                !new File(extractedDir, 'plugins/openharmony/lib').isDirectory()) {
            throw new GradleException(
                    "Invalid DevEco dependency bundle ${devEcoDependencyVersion.get()} " +
                            "downloaded from ${devEcoObsBaseUrl.get()}")
        }
    }
}

ext {
    devEcoDir = devEcoDirProvider.get().asFile
    intellijIdeaVersion = targetIdeaVersion
}

ext.devEcoJars = { Project target, List<String> patterns ->
    def jarTrees = patterns.collect { pattern ->
        target.fileTree(rootProject.devEcoDir) { include pattern }
    }
    def verifyTask = target.tasks.register(
            'verifyDevEcoDependencies', VerifyDevEcoDependencies) {
        group = 'verification'
        dependsOn prepareDevEcoDependencies
        devEcoDirectory.set(devEcoDirProvider)
        jarPatterns.set(patterns)
        modulePath.set(target.path)
    }
    target.files(jarTrees).builtBy(verifyTask)
}

allprojects {
    group = 'com.huawei.cangjie'
    version = providers.gradleProperty('version').orElse('1.0.0-SNAPSHOT').get()
}

project(':tools-extension') {
    apply plugin: 'base'
}

configure(subprojects.findAll { it.path != ':tools-extension' }) {
    apply plugin: 'java-library'
    apply plugin: 'org.jetbrains.intellij.platform'
    repositories {
        maven { url = uri('https://repo.huaweicloud.com/repository/maven/') }
        mavenCentral()
        intellijPlatform { defaultRepositories() }
    }
    sourceSets {
        main { java.srcDirs = ['src/main/java']; resources.srcDirs = ['src/main/resources'] }
    }
    dependencies {
        intellijPlatform {
            intellijIdea(rootProject.intellijIdeaVersion) {
                useInstaller = false
            }
            bundledPlugin('com.intellij.java')
            bundledPlugin('com.intellij.modules.json')
        }
    }
    intellijPlatform {
        buildSearchableOptions = false
        pluginConfiguration {
            ideaVersion {
                sinceBuild = providers.gradleProperty('pluginSinceBuild').orElse('261')
                untilBuild = providers.gradleProperty('pluginUntilBuild').orElse('261.*')
            }
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'; options.release = 21
    }
    tasks.named('jar') {
        destinationDirectory = layout.buildDirectory.dir('intermediates/jars')
    }
    tasks.named('instrumentedJar') {
        destinationDirectory = layout.buildDirectory.dir('intermediates/jars')
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.desktop/javax.swing=ALL-UNNAMED'
    }
}
